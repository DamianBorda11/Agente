<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Estado 2 — Grid Básico (para completar en clase)</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      padding: 20px;
    }

    body.dark-mode {
      background-color: #000000;
      color: #640b0b;
    }
    /* ==========================================
       ESTADO 2 — Grid Básico (SIN RESOLVER a propósito)
       Este es el punto de partida para escribirlo en vivo en clase.
       Sigue los TODO en orden — cada uno agrega UNA propiedad de la
       tabla "Propiedades del contenedor" del recurso de Grid/Flexbox
       (semana_03_recurso_css_grid_flexbox_tailwind.md).
    ========================================== */
    .grid-container {
      /* TODO 1: activa Grid en este contenedor.
         Propiedad: display
         Valor: grid
      */
      
      display: grid ;
      
      /* TODO 2: define 3 columnas de 200px cada una.
         Propiedad: grid-template-columns
         Pista: puedes escribir "200px 200px 200px" a mano,
         o usar el atajo repeat(3, 200px) — ambos hacen lo mismo.
      */
      grid-template-columns: 100px 2fr 1fr;
      
      /* TODO 3: agrega espacio entre las celdas, sin usar márgenes.
         Propiedad: gap
         Valor sugerido: 15px
      */
      
       gap:10px;
      
      @media (min-width: 500px) {
      .grid-item {
        background-color: rgb(109, 0, 103); 
        }
       }
      
       @media (min-width: 600px) {
      .grid-item {
        border-radius: 50px;
        background-color: rgb(129, 4, 4); 
        }
       }

       @media (min-width: 600px) {
      .grid-item2 {
        display: none;
       }
      }

      /* Ya viene incluido, no lo toques: */
      background-color: #ecf0f1;
      padding: 15px;
      border-radius: 8px;
    }

    .grid-item {
      background-color: #3498db;
      color: white;
      padding: 30px;
      text-align: center;
      font-size: 1.5rem;
      border-radius: 6px;
    }
    .grid-item2 {
      background-color: #3498db;
      color: white;
      padding: 30px;
      text-align: center;
      font-size: 1.5rem;
      border-radius: 6px;
    }
    .grid-item3 {
      background-color: #3498db;
      color: white;
      padding: 30px;
      text-align: center;
      font-size: 1.5rem;
      border-radius: 6px;
    }

    /* TODO 4 (opcional, para quien termine antes): alinea el
       contenido de cada celda al centro verticalmente.
       Propiedad: align-items (va en .grid-container, no en .grid-item)
       Valor: center
    */
  </style>
</head>
<body>
  <h1>Mi Primer Grid</h1>
  <p style="margin: 20px 0;">Grid con 3 columnas de 200px cada una — completa los TODO del CSS.</p>

  <div class="grid-container">
    <div class="grid-item">1</div>
    <div class="grid-item">2</div>
    <div class="grid-item">3</div>
    <div class="grid-item">4</div>
    <div class="grid-item">5</div>
    <div class="grid-item">6</div>
    <div " class="grid-item">7</div>
    <div class="grid-item">8</div>
    <div id="demo"class="grid-item">9</div>
  </div>
  
  <button id="boton">Botón</button>
  <button id="btnOscuro">Dark mode</button>

  <div id="caja2" class="grid-container">
    <div class="grid-item2">1</div>
    <div class="grid-item2">2</div>
    <div class="grid-item2">3</div>
  </div>

  <div id="caja3" class="grid-container">
    <div class="grid-item3">1</div>
    <div class="grid-item3">2</div>
    <div class="grid-item3">3</div>
  </div>

<script>

let txt = document.getElementById("demo");    
let btnMsg = document.getElementById("boton");
btnMsg.addEventListener("click", function() {
  console.log("click en el botón");
  txt.textContent = "Holiiis";
  txt.style.backgroundColor = 'green';
  
});


let btnOscuro = document.getElementById("btnOscuro");

btnOscuro.addEventListener("click", function() {
  console.log("click en el botón");
document.body.classList.toggle("dark-mode");
if (document.body.classList.contains("dark-mode")) {
  btnOscuro.textContent = "Light mode";
} else {
  btnOscuro.textContent = "Dark mode"; }
});

// Elemento que queremos ocultar/mostrar según el ancho de pantalla
let caja3 = document.getElementById("caja3");

// matchMedia crea un "sensor" para el mismo breakpoint que usa el CSS
// (min-width: 600px). mqAnchoMedio.matches va cambiando entre true/false
// solo cuando la ventana cruza esos 600px, no en cada pixel que se mueve.
let mqAnchoMedio = window.matchMedia("(min-width: 600px)");

// Esta función decide si caja3 se ve o no, según el sensor.
// e.matches === true  -> la pantalla YA tiene 600px o más -> se oculta
// e.matches === false -> la pantalla es angosta            -> se muestra en grid
function actualizarCaja3(e) {
  caja3.style.display = e.matches ? "none" : "grid";
}

// Se ejecuta una vez apenas carga la página, para que arranque en el
// estado correcto (por si la ventana ya está ancha desde el inicio).
actualizarCaja3(mqAnchoMedio);

// Y se vuelve a ejecutar cada vez que el sensor detecta que cruzamos
// el umbral de 600px (por ejemplo, al redimensionar la ventana).
mqAnchoMedio.addEventListener("change", actualizarCaja3);

</script>

</body>
</html>
