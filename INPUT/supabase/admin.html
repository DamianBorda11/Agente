<!DOCTYPE html>
<html>
<head>
  <!-- CDN: trae la librería de Supabase ANTES que nuestros propios
       scripts — sin esta línea, "supabase.createClient" no existiría
       todavía cuando supabaseClient.js intente usarlo -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <!-- Sin esta línea el celular "simula" una pantalla de PC y todo se ve diminuto -->
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <!-- Fuentes: Metal Mania (títulos), Orbitron (interfaz futurista), Oswald (texto) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Metal+Mania&family=Orbitron:wght@500;700&family=Oswald:wght@400;700&display=swap">
  <!-- Estilos de esta página (metal + cyberpunk, modo oscuro y claro) -->
  <link rel="stylesheet" href="css/admin.css">
</head>

<body>

  <section id="zona-acceso-admin">
  <p id="estado-sesion-admin" role="status">No has iniciado sesión.</p>

  <form id="form-registro-admin">
    <h3>Registrar administrador</h3>
    <label for="admin-registro-nombre">Nombre</label>
    <input id="admin-registro-nombre" type="text" required>

    <label for="admin-registro-correo">Correo</label>
    <input id="admin-registro-correo" type="email" required>

    <label for="admin-registro-password">Contraseña</label>
    <input id="admin-registro-password" type="password" minlength="6" required>

    <button type="submit">Crear cuenta de administrador</button>
  </form>

  <form id="form-login-admin">
    <h3>Iniciar sesión</h3>
    <label for="admin-login-correo">Correo</label>
    <input id="admin-login-correo" type="email" required>

    <label for="admin-login-password">Contraseña</label>
    <input id="admin-login-password" type="password" required>

    <button type="submit">Iniciar sesión</button>
  </form>
</section>

<button id="btn-logout-admin" type="button" hidden>Cerrar sesión</button>

<!-- el panel real (catálogo, mis clientes...) debe quedar oculto hasta
     que admin.js confirme sesión iniciada Y que existe fila en admins_practica -->

  <header class="header">
    <!-- data-text: el CSS copia este texto en dos capas (roja y blanca) para el glitch -->
    <h1 data-text="Videoclub">Videoclub</h1>
    <button id="btn-tema" type="button">☀ Modo claro</button>
  </header>

  <!-- panel-admin: oculto por defecto; admin.js lo muestra solo si hay
       sesión iniciada Y fila en admins_practica (ver mostrarEstadoSesionAdmin) -->
  <div id="panel-admin" hidden>
  <!-- Dos columnas: estantería a la izquierda, formulario a la derecha -->
  <main class="columnas">

    <section class="col-productos">
      <button id="btn-traer">Ver estantería</button>
      <!-- JSON crudo, cerrado por defecto: se abre solo para depurar -->
      <details id="json-crudo" hidden>
        <summary>Ver JSON</summary>
        <pre id="resultado"></pre>
      </details>
      <!-- Filtros del catálogo (el único buscador): aparecen al abrir la estantería -->
      <div id="filtros" class="filtros" hidden>
        <label class="filtro-texto">Buscar
          <input type="search" id="filtro-texto" placeholder="Título, director o sinopsis">
        </label>
        <label>Género
          <select id="filtro-categoria">
            <option value="">Todos</option>
          </select>
        </label>
        <label>Disponibilidad
          <select id="filtro-disponible">
            <option value="">Todas</option>
            <option value="si">En estante</option>
            <option value="no">Rentadas</option>
          </select>
        </label>
        <label>Renta mín. (COP)
          <input type="number" id="filtro-precio-min" min="0" step="500" placeholder="0">
        </label>
        <label>Renta máx. (COP)
          <input type="number" id="filtro-precio-max" min="0" step="500" placeholder="∞">
        </label>
        <label>Ordenar
          <select id="filtro-orden">
            <option value="id">Por defecto</option>
            <option value="precio-asc">Renta: menor a mayor</option>
            <option value="precio-desc">Renta: mayor a menor</option>
            <option value="nombre">Título (A–Z)</option>
          </select>
        </label>
        <button type="button" id="btn-limpiar-filtros">Limpiar</button>
        <p id="contador-productos"></p>
      </div>

      <!-- Aquí se pintan las cajas VHS de "Ver estantería" -->
      <div id="lista-productos"></div>
    </section>

    <section class="col-formulario">
      <h3>Mostrador</h3>
      <!-- admin.js crea aquí el formulario -->
      <div id="form-container"></div>

      <div id="notificacion"></div>
    </section>

  </main>
  </div>

  <!-- supabaseClient.js crea "db" (sección 4.3): el cliente ya
       conectado a tu proyecto de Supabase. Lo vamos a usar en
       admin.js, por eso tiene que cargarse ANTES que ese archivo -->
  <script src="js/supabaseClient.js"></script>
  <!-- admin.js: aquí escribes el código de los Pasos 2, 3 y 4 -->
  <script src="js/admin.js"></script>
</body>
</html>
