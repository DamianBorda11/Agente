<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <!-- Fuente estilo punk usada en los titulos, el badge y el boton -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Cambia la clase "light-mode" en <body> desde index.js -->
    <button class="toggle-btn" id="btnModoClaro">Modo claro</button>

    <!-- Vacio a proposito: index.js la llena con las 12 cartas al cargar la pagina -->
    <section class="galeria" id="galeria"></section>

    <!-- Modal de detalle: oculto por defecto, index.js lo llena y lo muestra al hacer click en una carta -->
    <div class="modal-overlay" id="modalOverlay">
        <div class="modal-content">
            <button class="modal-close" id="modalClose">&times;</button>
            <div id="modalBody"></div>
        </div>
    </div>

    <script src="index.js"></script>
</body>

</html>
