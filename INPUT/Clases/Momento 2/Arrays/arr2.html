<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Arrays - Ejercicio 2</title>
</head>
<body>
  <input type="text" id="textInput">
  <button id="button">Enviar</button>
  <button id="button2">Eliminar</button>
  <button id="button3" onclick="eliminarPrimero()">Eliminar primero</button>
  <button id="button4">Mostrar lista</button>
  <button id="button5">Buscar</button>
  <button id="button6">Eliminar por nombre</button>
  <button id="button7">Cambiar elemento</button>
    <p id="resultado"></p>
    <ul id="lista"></ul>

  <script>

    let arr = ["Light", "L", "Misa", "Kira", "Ryuk", "Rem", "Near", "Mello"];

    const textInput = document.getElementById("textInput");
    const button = document.getElementById("button");
    const resultado = document.getElementById("resultado");
    const button2 = document.getElementById("button2");
    const button4 = document.getElementById("button4");
    const button5 = document.getElementById("button5");
    const button6 = document.getElementById("button6");
    const button7 = document.getElementById("button7");
    const lista = document.getElementById("lista");

    button.addEventListener("click", function() {
       console.log("input:", textInput.value.trim().toLowerCase());
       resultado.textContent = textInput.value.trim().toLowerCase();

       //arreglar valor ingresado al arreglo
       //arr.push(textInput.value.trim().toLowerCase());
       //valor ingresado al inicio del arreglo
       arr.unshift(textInput.value.trim().toLowerCase());
    });
    button2.addEventListener("click", eliminarUltimo);
    button4.addEventListener("click", mostrarLista);
    button5.addEventListener("click", buscarElemento);
    button6.addEventListener("click", eliminarElemento);
    button7.addEventListener("click", cambiarElemento);

    function eliminarUltimo() {
      if (arr.length > 0) {
        arr.pop();
        resultado.textContent = "Último elemento eliminado. Nuevo arreglo: " + arr.join(", "); mostrarLista();
      } else {
        resultado.textContent = "El arreglo está vacío.";
      }
    }

    function eliminarPrimero() {
      if (arr.length > 0) {
        arr.shift();
        resultado.textContent = "Primer elemento eliminado. Nuevo arreglo: " + arr.join(", "); mostrarLista();
      } else {
        resultado.textContent = "El arreglo está vacío.";
      }
    }

    function mostrarLista() {
      lista.innerHTML = "";
      arr.forEach(function(item) {
        const li = document.createElement("li");
        li.textContent = item;
        lista.appendChild(li);
      });
    }
   
    function buscarElemento() {
      const valorBuscado = textInput.value.trim().toLowerCase();
      const indice = arr.findIndex(item => item.toLowerCase() === valorBuscado);
      if (indice !== -1) {
        resultado.textContent = "Elemento encontrado en la posición: " + indice;
      } else {
        resultado.textContent = "Elemento no encontrado en el arreglo.";
      }
    }

function eliminarElemento() {
   let valorBuscado = textInput.value.trim().toLowerCase();
   if (valorBuscado === "") {
     resultado.textContent = "Por favor, ingrese un valor para eliminar.";
     return;
   }
   let indice = arr.findIndex(item => item.toLowerCase() === valorBuscado);
   if (indice !== -1) {
     resultado.textContent = "Elemento eliminado de la posición:" + indice; 
    arr.splice(indice, 1);
    mostrarLista();
   }
   else {
     resultado.textContent = "Elemento no encontrado en el arreglo.";
   }
  }

function cambiarElemento() {
 let valorBuscado = textInput.value.trim().toLowerCase();
   if (valorBuscado === "") {
     resultado.textContent = "Por favor, ingrese un valor para eliminar.";
     return;
   }

   let indice = arr.findIndex(item => item.toLowerCase() === valorBuscado);
   if (indice !== -1) {
     let nuevoValor = prompt("Ingrese el nuevo valor para reemplazar '" + arr[indice] + "':");
     if (nuevoValor !== null && nuevoValor.trim() !== "") {
       arr[indice] = nuevoValor.trim().toLowerCase();
       resultado.textContent = "Elemento en la posición " + indice + " cambiado a: " + arr[indice];
       mostrarLista();
     } else {
       resultado.textContent = "No se ingresó un nuevo valor válido.";
     }
   } else {
     resultado.textContent = "Elemento no encontrado en el arreglo.";
   }
}
    mostrarLista();
  </script>
</body>
</html>
